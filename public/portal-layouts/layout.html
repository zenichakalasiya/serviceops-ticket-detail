<!doctype html>
<!--
  One layout, opened at the right artboard.

  ⚠️ WHY A WRAPPER AND NOT A #fragment ON THE CANVAS ITSELF. dc-runtime does not just render into
  the document — it REBUILDS it, twice: once from its parsed template, then again after an async
  fetch(location.href) -> updateHtml. It rebuilds <head> too (the live head comes out holding the
  doc's own <helmet> content, React UMD and all). So a plain #3d is resolved by the browser before
  that artboard exists and is silently dropped, and a retry script injected into the canvas — before
  </body> OR in <head> — is discarded along with everything else the runtime replaces. Both were
  tried; both worked on localhost, where the runtime's second pass happens to land before the first
  tick, and both did nothing on Pages, where it lands after.

  Driving it from a PARENT document solves it properly: this page is not the runtime's to rewrite,
  so its script survives every rebuild, and the canvas file stays byte-identical to
  "ServiceOps portal layout system (2)/" with nothing injected into it at all.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Layout · Support Portal</title>
<style>
  html, body { margin: 0; height: 100%; background: #e6eaf1; }
  /* The canvas paints its own ground; the frame is just a viewport onto it. */
  iframe { display: block; width: 100%; height: 100%; border: 0; }

  .bar {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px 6px 8px; border-radius: 6px;
    background: rgba(255,255,255,.94); border: 1px solid #DFE5ED;
    box-shadow: 0 2px 10px rgba(15,23,42,.10);
    font: 500 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #364658; text-decoration: none;
  }
  .bar:hover { background: #fff; border-color: #CBD5E1; }
  .bar .id {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 22px; height: 18px; padding: 0 5px; border-radius: 4px;
    background: #e8f4fd; color: #2A6FAF; font-size: 11px; font-weight: 600;
  }
  .bar .sep { width: 1px; height: 14px; background: #E5E7EB; }
</style>
</head>
<body>

<a class="bar" href="./">&larr; All layouts <span class="sep"></span><span class="id" id="badge"></span><span id="label"></span></a>
<iframe id="frame" title="Support Portal layout"></iframe>

<script>
(function () {
  /* ?id=3d — the artboard to land on. Anything else falls through to the canvas top rather than
     erroring: a bad link should still show you the layouts. */
  var id = new URLSearchParams(location.search).get('id') || '';
  var CANVAS = 'Support Portal Layout System.dc.html';

  var frame = document.getElementById('frame');
  frame.src = encodeURIComponent(CANVAS).replace(/%2F/g, '/');

  document.getElementById('badge').textContent = id || '—';

  if (!id) return;

  /* ⚠️ Re-asserted, not scrolled once. The runtime rebuilds the iframe's DOM twice and the second
     pass resets its scroll, so a single scrollIntoView lands and is then undone. Keep putting the
     target back until it has HELD the top for ~800ms, which is how we know the rebuilds are over.
     ⚠️ And stop the moment the reader takes over — a retry that ignored them would drag the page
     back every time they scrolled away from where it landed. */
  var ticks = 0, settled = 0, stopped = false;
  function stop() { stopped = true; }
  ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(function (e) {
    addEventListener(e, stop, { passive: true, once: true });
    // The pointer is usually over the iframe, so its document has to report the same intent.
    frame.addEventListener('load', function () {
      try { frame.contentWindow.addEventListener(e, stop, { passive: true, once: true }); } catch (_) {}
    });
  });

  var timer = setInterval(function () {
    if (stopped || ++ticks > 150) return clearInterval(timer); /* ~15s ceiling */
    var doc;
    try { doc = frame.contentDocument; } catch (_) { return clearInterval(timer); }
    if (!doc) return;
    var el = doc.getElementById(id);
    if (!el) return;

    var name = (el.textContent || '').trim().split('\n')[1];
    if (name) document.getElementById('label').textContent = name.trim();

    var top = el.getBoundingClientRect().top;
    if (Math.abs(top) > 4) { el.scrollIntoView(); settled = 0; }
    else if (++settled >= 8) clearInterval(timer);
  }, 100);
})();
</script>

</body>
</html>
